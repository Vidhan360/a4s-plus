# A4S+ continuous integration.
#
# HONESTY NOTE: this workflow was authored in an offline sandbox and has never
# been executed by GitHub Actions. Every command in it, however, was run
# locally and passed — see README "Verification status" for the exact results.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  A4S_JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
  A4S_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/a4s
  A4S_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/a4s_test
  A4S_REDIS_URL: redis://127.0.0.1:6379/0
  A4S_CORS_ORIGINS: http://127.0.0.1:3000
  A4S_SEED_ADMIN_PASSWORD: Adm1n-A4Splus-2026!
  A4S_SEED_COMMANDER_PASSWORD: Cmdr-A4Splus-2026!
  A4S_SEED_MEDICAL_PASSWORD: Medic-A4Splus-2026!
  A4S_SEED_OPERATOR_PASSWORD: Oper-A4Splus-2026!
  A4S_SEED_VIEWER_PASSWORD: View-A4Splus-2026!

jobs:
  honesty:
    name: Honesty scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/honesty-scan.sh

  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a4s
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-dev.txt
      - name: Create test database (UTF-8 required for JSONB)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE a4s_test ENCODING 'UTF8' TEMPLATE template0"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app ml seeds
      - run: alembic upgrade head
      - run: python -m pytest -q --cov=app --cov=ml --cov-report=term-missing

  frontend:
    name: Frontend (lint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a4s
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements.txt
      - name: Migrate + seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m seeds.seed --history 90
      - name: Start API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break || sleep 2
          done
      - name: Build + start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm ci
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/login > /dev/null && break || sleep 2
          done
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Server logs on failure
        if: failure()
        run: tail -n 200 /tmp/api.log /tmp/web.log || true